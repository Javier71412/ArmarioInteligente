# CI de ArmarioInteligente (CONSTRAINTS.md › «Dónde corre cada cosa»): sin verde no se fusiona.
# Tres trabajos en paralelo para que cada fallo se vea por separado en el PR.
# Acciones fijadas por SHA (la etiqueta va en el comentario).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # floor-guard compara con origin/main y lee los commits del PR: hace falta el historial.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # floor-guard + typecheck + lint + jest --coverage. Cualquier salida distinta de 0 (también
      # el 2 de floor-guard cuando no puede ejecutarse) pone el trabajo en rojo.
      - run: npm run check

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Binario oficial (https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1) con el SHA-256
      # de gitleaks_8.30.1_checksums.txt fijado aquí: si el archivo cambia, el paso falla.
      - name: gitleaks dir . --redact --no-banner
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner

  audit:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Solo lo que va al APK, y solo alto o crítico (CONSTRAINTS.md §2 «Dependencias»).
      - run: npm audit --omit=dev --audit-level=high
