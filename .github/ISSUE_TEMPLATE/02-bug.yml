# Plantilla de error. Sintaxis: GitHub issue forms
# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
name: Error
description: Algo no funciona como dice la spec.
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        El arreglo empieza por un test que reproduce el error (commit `test(...)` del probador) y luego el `fix(...)` del desarrollador (`CONSTRAINTS.md` §1).
        **Nunca pegues claves, tokens ni datos personales** en la issue (el repo es público).
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Lo que ves.
    validations:
      required: true
  - type: textarea
    id: que-esperaba
    attributes:
      label: Qué esperaba
      description: Lo que dice la spec (enlaza `spec/SPEC-<id>.md` y el apartado).
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Dónde
      description: Dispositivo y versión (p. ej. Redmi Note 15 Pro 5G, HyperOS …, build de release) o «Jest/Node».
    validations:
      required: true
  - type: textarea
    id: registro
    attributes:
      label: Registro o captura
      description: Salida de logcat, del test o de la CI. Se mostrará como código.
      render: shell
